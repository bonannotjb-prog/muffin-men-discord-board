name: Check connections

# Run this by hand after adding the secrets, and whenever a job fails.
# It tests each connection and prints OK or the reason. It posts nothing.

on:
  workflow_dispatch: {}

env:
  PANEL_HOST: ${{ secrets.PANEL_HOST }}
  PANEL_SERVER_ID: ${{ secrets.PANEL_SERVER_ID }}
  PANEL_API_KEY: ${{ secrets.PANEL_API_KEY }}
  MC_ADDRESS: ${{ secrets.MC_ADDRESS }}
  MC_WORLD_DIR: "world"            # the world folder name on the server
  MC_NAME: "Muffin Men"            # name shown in the picture headers
  MC_TIMEZONE: "America/Phoenix"   # time zone for the "Updated" line

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test every connection
        run: python check.py

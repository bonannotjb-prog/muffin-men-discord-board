name: Minecraft server status

# How this stays close to live: GitHub cannot schedule anything faster than every
# 5 minutes, so instead one job stays running for about 5.5 hours and checks the
# server every 30 seconds. The schedule below only exists to start the next job.
# Because of the concurrency group, a new job waits in line while one is running
# and takes over within about a minute of the old one finishing.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch: {}   # adds a "Run workflow" button for manual runs

permissions:
  contents: write         # lets the job save the Discord message ids back to the repo

concurrency:
  group: mc-server-status
  cancel-in-progress: false

env:
  DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
  PANEL_HOST: ${{ secrets.PANEL_HOST }}
  PANEL_SERVER_ID: ${{ secrets.PANEL_SERVER_ID }}
  PANEL_API_KEY: ${{ secrets.PANEL_API_KEY }}
  MC_ADDRESS: ${{ secrets.MC_ADDRESS }}
  MC_WORLD_DIR: "world"            # the world folder name on the server
  MC_NAME: "Muffin Men"            # name shown in the picture headers
  MC_TIMEZONE: "America/Phoenix"   # time zone for the "Updated" line
  MC_PACK: "All the Mods 11"       # modpack line in the picture; add the version if you like
  BLUEMAP_URL: ${{ secrets.BLUEMAP_URL }}   # optional: adds a "Live map" link under the picture
  MC_SHOW_ADDRESS: "0"             # 1 = show the join address under the picture
  STATUS_INTERVAL: "30"            # seconds between checks (minimum 15)
  STATUS_REDRAW_SECONDS: "120"     # longest gap between redraws, keeps CPU and memory fresh
  STATUS_RUN_MINUTES: "330"        # keep under the job's 6 hour limit

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the picture tools
        run: pip install --quiet pillow

      - name: Post or update the messages once
        run: python status.py --once

      - name: Save state (message ids and weekly heartbeat)
        run: |
          # Weekly heartbeat: this file changes once a week, so the repository always
          # has a recent commit and GitHub never pauses the schedule for inactivity.
          mkdir -p state
          date -u +%G-W%V > state/heartbeat-status.txt
          if [ -n "$(git status --porcelain state)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state
            git commit -m "Save status state"
            git pull --rebase
            git push
          fi

      - name: Keep the picture updated
        run: python status.py

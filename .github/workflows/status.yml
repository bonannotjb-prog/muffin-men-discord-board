name: Minecraft server status

# How this stays close to live: GitHub cannot schedule anything faster than every
# 5 minutes, so instead one job stays running for about 5.5 hours and checks the
# server every 30 seconds. Each job starts the next one as its last step
# (keepalive.py); the schedule below is the backup. Because of the concurrency
# group, a new job waits in line while one is running and takes over within about
# a minute of the old one finishing.

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:      # the "Run workflow" button
    inputs:
      run_minutes:
        description: "Minutes to run before handing over (leave empty for the normal 330)"
        type: string
        default: ""

permissions:
  actions: write          # lets the job start other jobs (see keepalive.py)
  contents: write         # lets the job save the Discord message ids back to the repo

concurrency:
  group: mc-server-status
  cancel-in-progress: false

env:
  DISCORD_STATUS_WEBHOOK_URL: ${{ secrets.DISCORD_STATUS_WEBHOOK_URL }}
  PANEL_HOST: ${{ secrets.PANEL_HOST }}
  PANEL_SERVER_ID: ${{ secrets.PANEL_SERVER_ID }}
  PANEL_API_KEY: ${{ secrets.PANEL_API_KEY }}
  MC_ADDRESS: ${{ secrets.MC_ADDRESS }}
  MC_WORLD_DIR: "world"            # the world folder name on the server
  MC_NAME: "Muffin Men"            # name shown in the picture headers
  MC_TIMEZONE: "America/Phoenix"   # time zone for the "Updated" line
  MC_PACK: "All the Mods 11"       # modpack line in the picture; add the version if you like
  BLUEMAP_URL: ${{ secrets.BLUEMAP_URL }}   # optional: adds a "Live map" link under the picture
  MC_SHOW_ADDRESS: "0"             # 1 = show the join address under the picture
  STATUS_INTERVAL: "30"            # seconds between checks (minimum 15)
  STATUS_REDRAW_SECONDS: "120"     # longest gap between redraws, keeps CPU and memory fresh
  STATUS_RUN_MINUTES: ${{ inputs.run_minutes || '330' }}   # keep under the job's 6 hour limit

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install the picture tools
        run: pip install --quiet pillow

      - name: Post or update the messages once
        run: python status.py --once

      - name: Save state (message ids and weekly heartbeat)
        run: |
          # Weekly heartbeat: this file changes once a week, so the repository always
          # has a recent commit and GitHub never pauses the schedule for inactivity.
          mkdir -p state
          date -u +%G-W%V > state/heartbeat-status.txt
          python keepalive.py save "Save status state"

      - name: Keep the picture updated
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          # The ticker runs beside the loop. Every few minutes it starts any other
          # job whose scheduled time passed with no run (see keepalive.py).
          python keepalive.py ticker &
          ticker=$!
          code=0
          python status.py || code=$?
          kill "$ticker" 2>/dev/null || true
          exit "$code"

      - name: Tell the admin channel if this job failed
        if: failure()
        env:
          # Optional secret. Nothing is sent until it exists.
          DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
        run: python keepalive.py alert

      - name: Start the next status job
        # Hands over straight away instead of waiting for GitHub's timer, which
        # left the board frozen for hours. Cancelling a run stops the chain.
        if: ${{ !cancelled() }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          DISCORD_ALERT_WEBHOOK_URL: ${{ secrets.DISCORD_ALERT_WEBHOOK_URL }}
        run: python keepalive.py next
